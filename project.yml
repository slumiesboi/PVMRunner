name: PVMRunner
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
targets:
  PVMRunner:
    type: application
    platform: macOS
    sources:
      - path: PVMRunner
      - path: scripts/install-socket-vmnet-bridged.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PVMRunner
        PRODUCT_NAME: PVMRunner
        INFOPLIST_FILE: PVMRunner/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PVMRunner/Resources/PVMRunner.entitlements
        # Ad-hoc "Sign to Run Locally" by default. Set DEVELOPMENT_TEAM and
        # CODE_SIGN_IDENTITY to "Apple Development" in Xcode for a team signature.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - sdk: Virtualization.framework
      - sdk: Security.framework
  PVMRunnerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PVMRunnerTests
    dependencies:
      - target: PVMRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PVMRunnerTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PVMRunner.app/Contents/MacOS/PVMRunner"
schemes:
  PVMRunner:
    build:
      targets:
        PVMRunner: all
        PVMRunnerTests: [test]
    test:
      targets:
        - PVMRunnerTests
